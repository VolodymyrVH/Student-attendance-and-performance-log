<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Owl Lessons – Login</title>
    <link rel="stylesheet" href="css/loginpage.css">
</head>
<body>
    <div class="topbar">owl lessons</div>
    <div class="logo">
        🦉 Owl lessons
    </div>
    <div class="login-box">
        <form id="login-form">
            <label>Логін</label><br>
            <input class="login-input" type="text" name="full_name"><br>

            <label>Пароль</label><br>
            <input class="login-input" type="password" name="password">

            <a href="#" class="forgot">Забув пароль ??</a><br>

            <button type="submit" class="next-btn">Далі</button>
        </form>
    </div>
    <script src="js/loginpage.js"></script>
</body>
</html>
